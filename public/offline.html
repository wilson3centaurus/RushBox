<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RushBox — offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #2c3e50;
        color: #fff;
        font: 15px/1.5 system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .bolt {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: #f39c12;
        display: grid;
        place-items: center;
        margin: 0 auto 20px;
        font-size: 32px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: rgba(255, 255, 255, 0.6); margin: 0; max-width: 260px; }
    </style>
  </head>
  <body>
    <div>
      <div class="bolt">⚡</div>
      <h1>You're offline</h1>
      <p>Check your connection — RushBox will pick up right where you left off.</p>
    </div>
  </body>
</html>
